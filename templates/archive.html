{% extends "base.html" %}
{% block title %}归档 · {{ site_name }}{% endblock %}
{% block content %}
<h1 class="page-title">归档</h1>
{% for group in groups %}
<section class="date-group">
  <h2 class="date-heading">{{ group.date }}</h2>
  {% for item in group.entries %}
  {% include "partials/item.html" %}
  {% endfor %}
</section>
{% else %}
<p class="empty">暂无内容。</p>
{% endfor %}
{% endblock %}
